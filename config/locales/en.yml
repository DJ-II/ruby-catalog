    tab: Custom ID
    title: Custom inventory numbers
    description: Build the unique number generated for each new item. Existing item numbers never change when you change this template.
    preview: Example
    preview_note: An illustrative sample. Actual random values and sequence numbers are generated at item creation.
    manual_save: Save changes manually
    elements: ID elements
    reorder_help: Drag the grip to reorder, or focus it and press ↑ / ↓. Add up to 15 elements.
    add: Add element
    empty: No elements defined. The default INV-000001 sequence format will be used.
    trash: Drop an element here to remove it, or use the × button on the element.
    drag: Drag to reorder (keyboard ↑ / ↓)
    remove: Remove element
    element_type: Element type
    pattern: Text or format
    help: Formatting help
    types:
      fixed: Fixed text
      random20: 20-bit random
      random32: 32-bit random
      random6: 6-digit random
      random9: 9-digit random
      guid: GUID
      datetime: Date/time
      sequence: Sequence
    help_text:
      fixed: Any constant Unicode text or emoji, such as COMP- or 📚_. It appears exactly as entered.
      random20: Random integer from 0 to 1,048,575. Use X5 for five-digit uppercase hexadecimal (A7E3A) or D7 for padded decimal; D
        or X omits leading padding.
      random32: Random integer from 0 to 4,294,967,295. Use X8 for eight-digit uppercase hexadecimal (E74FA329), or D10 for padded decimal.
      random6: Random integer from 0 to 999999. D6 always yields six digits, with leading zeros when needed. D1 and X5 are also supported.
      random9: Random integer from 0 to 999999999. D9 yields nine digits, including leading zeros. D1 and X8 are also supported.
      guid: Use D for the hyphenated form, N for 32 hex digits without hyphens, B for braces or P for parentheses.
      datetime: Use yyyy, yy, MM, dd, ddd, HH, mm, ss and separators such as -, _, /, space, colon or period. Example yyyy-MM-dd.
      sequence: The next value is max(existing sequence_number) + 1 when the item is created. Use D3 for 001, D6 for 000001, X5 for
        hex, or D for an unpadded number.
    outside_hint: Dropping an ID element outside the list removes it. You can also use the × button or the removal zone.
    errors:
      too_many: The ID may contain at most %{count} elements.
      generated_too_long: Generated inventory number exceeds %{count} characters.
      unknown_kind: Unknown ID element type.
      empty_pattern: Each ID element requires a format or fixed text.
      part_too_long: An ID element cannot exceed %{count} characters.
      number_format: Use D, D3, D6, X5, or X8 (width 1–99).
      guid_format: GUID format must be N, D, B, or P.
      date_format: 'Use yyyy, yy, MM, dd, ddd, HH, mm, ss and separators - _ . / : or space.'
