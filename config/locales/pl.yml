      random6: Liczba losowa 6-cyfrowa
      random9: Liczba losowa 9-cyfrowa
      guid: GUID
      datetime: Data / godzina
      sequence: Sekwencja
    help_text:
      fixed: Dowolny stały tekst Unicode lub emoji, np. COMP- lub 📚_. Pojawia się dokładnie w podanej postaci.
      random20: Liczba z zakresu 0–1048575. Użyj X5 dla pięciu znaków szesnastkowych (A7E3A) lub D7 dla dziesiętnego zapisu z zerami.
      random32: Liczba z zakresu 0–4294967295. Użyj X8 dla ośmiu znaków szesnastkowych (E74FA329) lub D10 dla zapisu dziesiętnego.
      random6: Liczba z zakresu 0–999999. D6 zawsze daje sześć cyfr, uzupełniając je zerami. Dostępne są również D1 oraz X5.
      random9: Liczba z zakresu 0–999999999. D9 daje dziewięć cyfr, także z zerami na początku.
      guid: D to standardowa postać z myślnikami, N to 32 znaki bez myślników, B to nawiasy klamrowe, P to nawiasy okrągłe.
      datetime: 'Dostępne znaczniki yyyy, yy, MM, dd, ddd, HH, mm, ss i separatory - _ / spacja : . Przykład yyyy-MM-dd.'
      sequence: Następna wartość to największy istniejący numer sekwencji + 1. D3 oznacza 001, D6 000001, X5 szesnastkowo, a D bez zer.
    outside_hint: Upuszczenie elementu poza listą usuwa go. Możesz też użyć przycisku × albo obszaru usuwania.
    errors:
      too_many: Numer może zawierać maksymalnie %{count} elementów.
