      part_too_long: Element numeru nie może przekraczać %{count} znaków.
      number_format: Użyj D, D3, D6, X5 lub X8 (szerokość 1–99).
      guid_format: Format GUID musi mieć postać N, D, B lub P.
      date_format: 'Użyj yyyy, yy, MM, dd, ddd, HH, mm, ss i separatorów - _ . / : lub spacji.'
