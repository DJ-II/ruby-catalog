      random9: Liczba z zakresu 0–999999999. D9 daje dziewięć cyfr, także z zerami
        na początku.
      guid: D to standardowa postać z myślnikami, N to 32 znaki bez myślników, B to
        nawiasy klamrowe, P to nawiasy okrągłe.
      datetime: 'Dostępne znaczniki yyyy, yy, MM, dd, ddd, HH, mm, ss i separatory
        - _ / spacja : . Przykład yyyy-MM-dd.'
      sequence: Następna wartość to największy istniejący numer sekwencji + 1. D3
        oznacza 001, D6 000001, X5 szesnastkowo, a D bez zer.
