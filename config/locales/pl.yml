  privacy_policy:
    purpose:
      title: Cel
      body: Catalog jest edukacyjną aplikacją do zarządzania inwentarzami. Dane kont
        służą uwierzytelnianiu, współpracy i zarządzaniu inwentarzami.
    data:
      title: Przechowywane dane
      body: Catalog przechowuje nazwy użytkowników, adresy e-mail, skróty haseł (jeśli
        dotyczy), identyfikatory kont zewnętrznych, preferencje, inwentarze, przedmioty,
        komentarze i polubienia. Dostawcy OAuth mogą udostępniać nazwę oraz e-mail.
        Tokeny dostępu dostawców nie są zapisywane w rekordzie konta.
    visibility:
      title: Publiczna zawartość
      body: Inwentarze, przedmioty, dyskusje i nazwy profili są dostępne dla odwiedzających.
        Prywatny dostęp do zapisu ogranicza edycję, a nie odczyt. Nie umieszczaj danych
        poufnych ani osobowych w inwentarzach i dyskusjach.
    providers:
      title: Usługi zewnętrzne
      body: Render utrzymuje aplikację i bazę PostgreSQL. Cloudinary przechowuje zdjęcia.
        Google i GitHub zapewniają opcjonalne logowanie zgodnie z własnymi politykami
        prywatności. Usługi te mogą przetwarzać dane techniczne i konta potrzebne
        do ich działania.
    cookies:
      title: Pliki cookie
      body: Catalog wykorzystuje pliki cookie do obsługi sesji, bezpieczeństwa oraz
        preferencji języka i motywu. Aplikacja nie wykorzystuje celowo plików cookie
        do reklam ani analityki.
    deletion:
      title: Usuwanie konta
      body: Możesz zmienić nazwę użytkownika lub usunąć konto w ustawieniach konta
        po potwierdzeniu tożsamości. Usunięcie obejmuje konto, własne inwentarze,
        uprawnienia, polubienia i powiązania kont zewnętrznych. Wkład w cudze inwentarze
        pozostaje bez powiązania z autorem, a treść nie jest automatycznie anonimizowana.
        Pliki Cloudinary nie są automatycznie kasowane. Kopie zapasowe hostingu i
        autoryzacje dostawców mogą pozostawać zgodnie z ich zasadami retencji.
    contact:
      title: Kontakt i wnioski dotyczące danych
      body: W sprawach danych, usuwania zdjęć lub zachowanych treści skontaktuj się
        z administratorem przez kanał kontaktu podany przy projekcie. Przed szerszym
        udostępnieniem operator powinien podać publiczny adres kontaktowy.
