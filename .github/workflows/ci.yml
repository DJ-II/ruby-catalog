name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Scan Rails code
        run: bundle exec brakeman --no-pager --exit-on-warn --exit-on-error
      - name: Scan gem dependencies
        run: bundle exec bundler-audit check --update

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Ruby syntax
        run: find app config db lib test -type f \( -name '*.rb' -o -name '*.rake' \) -print0 | xargs -0 -n1 ruby -c
      - name: Check JavaScript module syntax
        run: |
          find app/javascript -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file" || exit 1
          done

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inventoryhub_test
      PARALLEL_WORKERS: '1'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventoryhub_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres -d inventoryhub_test" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Migrate test database
        run: bundle exec ruby bin/rails db:migrate
      - name: Run Rails tests
        run: bundle exec ruby bin/rails test
