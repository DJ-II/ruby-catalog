services:
  - type: web
    name: ruby-catalog
    runtime: ruby
    region: frankfurt
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: catalog-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: '1'

databases:
  - name: catalog-db
    databaseName: catalog
    user: catalog
    region: frankfurt
    plan: free